paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "dev_tools.py",
  "/.idea/",
  "/.venv/",
  "/.venv311/",
  ".github/",
  ".gitignore",
  "/scripts/",
  ".releaserc"
]
